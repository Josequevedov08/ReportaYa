version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-master
    container_name: reportaya_postgres
    environment:
      POSTGRES_DB: reportaya
      POSTGRES_USER: reportaya
      POSTGRES_PASSWORD: reportaya_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: reportaya_redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: reportaya_backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  pg_data: